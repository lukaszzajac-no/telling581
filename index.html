<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Telling reservedeler 581</title>
<style>
/* Styl Doka (shop.doka.com: niebieski #004588, żółty #FFDD00, grafit #2B2B2B, kwadratowe przyciski, nagłówki wersalikami)
   Układ jak Nordiska CRM: białe karty, etykiety-eyebrow, zakładki, panel admina z menu bocznym na PC */
:root{
  --navy:#004588; --navy-d:#00376D; --navy-soft:#E8EFF7; --yellow:#FFDD00; --yellow-soft:#FFF8CC;
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#2B2B2B; --muted:#6B7280; --line:#DCDFE4; --line-s:#C9CED6;
  --ok:#1E7B4A; --ok-soft:#E4F4EB; --warn:#B45309; --warn-soft:#FEF0DC; --bad:#C0261B; --bad-soft:#FDE8E6;
  --s0:#004588; --s1:#B45309; --s2:#6B3FA0;
  --r:4px; --w:560px;
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#E4E6EA;color:var(--ink);font:16px/1.4 var(--font)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em}

.app{max-width:var(--w);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.app.wide{--w:1100px}
.screen{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

/* --- nagłówek: biały pasek z logo Doka, żółta linia, tytuł niebieskimi wersalikami --- */
.bar{background:#fff;color:var(--ink);padding:10px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--yellow);box-shadow:0 2px 6px rgba(16,24,40,.06)}
.bar .row{display:flex;align-items:center;gap:10px;min-height:36px}
.bar .brand{display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
.bar .brand img{height:38px;width:auto;display:block;margin:-6px -4px -6px -8px}
.bar .brand .wm{font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.01em}
.bar .brand .lg{padding-left:10px;border-left:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.15}
.bar .brand .lg b{display:block;color:var(--ink);font-size:13px;letter-spacing:.04em}
.bar .meta{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;font-weight:600;line-height:1.3}
.bar h2{margin:10px 0 0;font-size:21px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.01em;line-height:1.15}
.bar h2 span{text-transform:none;color:var(--muted)!important;opacity:1!important}
.back{width:36px;height:36px;border-radius:var(--r);background:var(--bg);display:grid;place-items:center;color:var(--navy);font-size:22px;font-weight:700;flex:0 0 auto;border:1px solid var(--line)}
.progress{height:6px;background:#E6E8EC;border-radius:2px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy);border-radius:2px;transition:width .25s}
.content{flex:1 1 auto;padding:14px 14px 24px}
.foot{position:sticky;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;z-index:4}

/* --- przyciski Doka: kwadratowe, pogrubione wersaliki --- */
.btn{min-height:52px;border-radius:var(--r);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:active{background:var(--navy-d)}
.btn.navy{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line-s);color:var(--navy)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{min-height:40px;font-size:13px;padding:0 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.grow{flex:1}
.link{color:var(--navy);text-decoration:underline;font-size:14px;padding:6px;font-weight:600}

label.lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:4px 2px 6px;text-transform:uppercase;letter-spacing:.12em}
.field{width:100%;height:52px;border:1.5px solid var(--line-s);border-radius:var(--r);padding:0 14px;background:#fff;font-size:18px;color:var(--ink)}
.field:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,69,136,.14)}
.banner{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:10px}
.banner.test{background:var(--yellow-soft);border-left:5px solid var(--yellow)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-left:5px solid var(--bad);font-weight:700}
.banner.info{background:var(--navy-soft);border-left:5px solid var(--navy)}

.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* --- kafelki sektorów (jak karty kursów w CRM) --- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:var(--r);padding:12px 14px 14px;text-align:left;border:1px solid var(--line);border-top:4px solid var(--navy);box-shadow:var(--shadow);min-height:112px;display:flex;flex-direction:column}
.tile:active{transform:scale(.98)}
.tile .nm{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.tile .code{font-size:25px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:2px}
.tile .cnt{margin-top:auto;font-size:13px;color:var(--muted);font-weight:600}
.tile .mini{height:5px;background:#E6E8EC;border-radius:2px;margin-top:6px;overflow:hidden}
.tile .mini i{display:block;height:100%;background:var(--navy)}
.tile.done{border-top-color:var(--ok);background:var(--ok-soft);border-color:#BFE3CE}
.tile.done .mini i{background:var(--ok)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:var(--ok);color:#fff}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.sticky{position:sticky;top:var(--barh,0px);background:var(--bg);padding:2px 0 10px;z-index:3}
.search{position:relative;flex:1}
.search input{padding-left:42px}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.scanbtn{flex:0 0 52px;height:52px;border-radius:var(--r);background:var(--yellow);color:var(--navy);display:grid;place-items:center}
.scanbtn svg{width:28px;height:28px}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--card);border-radius:var(--r);padding:11px 12px 11px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);border-left:5px solid var(--line-s);box-shadow:var(--shadow)}
.item .t{flex:1;min-width:0}
.item .nr{font-size:13px;color:var(--muted)}
.item .na{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .q{min-width:64px;text-align:right;font-size:22px;font-weight:800;color:#B8BEC8}
.item.counted{border-left-color:var(--ok)}
.item.extra{border-left-color:var(--warn)}
.qq{display:flex;flex-direction:column;align-items:flex-end;min-width:76px;gap:1px}
.qq span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.qq b{font-size:20px;margin-left:4px}
.c0{color:var(--s0)}.c1{color:var(--s1)}.c2{color:var(--s2)}
.empty-state{text-align:center;color:var(--muted);padding:26px 10px}

/* --- arkusz od dołu (wpis numeru i ilości) --- */
.scrim{position:fixed;inset:0;background:rgba(20,28,40,.5);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,560px);background:var(--card);border-radius:10px 10px 0 0;border-top:4px solid var(--yellow);z-index:11;transform:translate(-50%,105%);transition:transform .22s ease;padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:4px;background:var(--line-s);border-radius:2px;margin:2px auto 10px}
.sh-head{display:flex;gap:10px;align-items:flex-start}
.sh-head .nr{color:var(--muted);font-size:13px;font-weight:600}
.sh-head .na{font-weight:700;font-size:18px;line-height:1.25;color:var(--ink)}
.xbtn{background:var(--bg);color:var(--navy)}
.tabs{display:flex;background:#E6E8EC;border-radius:var(--r);padding:3px;margin:10px 0}
.tabs button{flex:1;padding:9px;border-radius:3px;font-weight:700;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nb{display:grid;gap:8px}
.nbx{border-radius:var(--r);padding:10px 12px;text-align:right;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;min-height:96px}
.nbx .lab{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.nbx .lab i{font-style:normal;width:22px;height:22px;border:2px solid currentColor;border-radius:2px;display:grid;place-items:center;font-size:12px}
.nbx .ex{font-size:13px;opacity:.8;min-height:18px;margin-top:4px;word-break:break-all}
.nbx b{font-size:32px;line-height:1.05;margin-top:auto}
.nbx.on{color:#fff}
.nbx.on .lab{color:#fff}
.nbx.on b{color:var(--yellow)}
.nbx.s0.on{background:var(--s0);border-color:var(--s0)}
.nbx.s1.on{background:var(--s1);border-color:var(--s1)}
.nbx.s2.on{background:var(--s2);border-color:var(--s2)}
.nbx.s0:not(.on) b{color:var(--s0)}.nbx.s1:not(.on) b,.nbx.s1:not(.on) .lab{color:var(--s1)}.nbx.s2:not(.on) b,.nbx.s2:not(.on) .lab{color:var(--s2)}
.nbsum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 2px 0}
.stsel{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.stsel button{padding:7px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stsel button.on.s0{background:var(--s0);border-color:var(--s0);color:#fff}
.stsel button.on.s1{background:var(--s1);border-color:var(--s1);color:#fff}
.stsel button.on.s2{background:var(--s2);border-color:var(--s2);color:#fff}
.wfields{display:grid;gap:8px}
.wf{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;text-align:left;width:100%}
.wf.on{border-color:var(--navy);background:var(--navy-soft)}
.wf span{font-size:14px;color:var(--muted);font-weight:600}
.wf b{font-size:24px;color:var(--navy)}
.wres{background:var(--yellow-soft);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:8px;border-left:4px solid var(--yellow)}
.wres b{font-size:28px;color:var(--navy)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.key{height:58px;border-radius:var(--r);background:#EEF0F3;font-size:26px;font-weight:700;color:var(--ink);border:1px solid #E1E4E9}
.key:active{background:#D9DDE3}
.key.op{background:var(--navy-soft);color:var(--navy);border-color:#D3E0EE}
.key.ok{background:var(--yellow);color:var(--navy);font-size:18px;border-color:#F0CF00}
.key.sm{font-size:15px}
.skip{display:block;margin:10px auto 0;color:var(--muted);font-size:14px;text-decoration:underline}
.serials{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.serials span{background:var(--bg);border-radius:2px;padding:5px 9px;font-size:13px;font-weight:700}

/* --- ekran sektora --- */
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn.big{min-height:84px;font-size:15px;flex-direction:column;gap:6px}
.btn.big svg{width:30px;height:30px}
.btn.big.navy{background:var(--navy)}
.btn.big.primary{background:var(--yellow);color:var(--navy)}
.sub{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:6px 2px 8px}
.search.small input{height:46px;font-size:16px}
.nrd{background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:center;margin-top:10px;border-bottom:4px solid var(--yellow)}
.nrd .res{font-size:38px;font-weight:800;color:var(--yellow);text-align:right;line-height:1.1;letter-spacing:.06em}
.nrd .nmatch{font-size:15px;font-weight:700;margin-top:4px;min-height:21px;text-align:right}
.nrd .nmatch.bad{color:#FFB4A8}
.cands{display:grid;gap:6px;margin-top:8px}
.cand{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:var(--r);padding:9px 12px;text-align:left;width:100%;border:1px solid var(--line)}
.cand .mono{font-weight:700;color:var(--navy)}
.cand .na{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.addnote{background:var(--yellow-soft);border-radius:var(--r);padding:8px 12px;font-size:14px;margin:8px 0 0;border-left:4px solid var(--yellow)}
.backnr{font-size:14px;color:var(--navy);text-decoration:underline;padding:4px 0;margin-top:4px;font-weight:600}
.sync{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:2px;margin-top:3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.sync.ok{background:var(--ok);color:#fff}.sync.busy{background:var(--navy-soft);color:var(--navy)}
.sync.offline,.sync.err{background:var(--yellow);color:var(--navy)}.sync.pin{background:var(--bad);color:#fff}
.statusline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:var(--r);padding:10px 12px;margin:12px 0 0;font-size:14px;border:1px solid var(--line)}
.statusline .sync{margin:0}
.statusline .sync.busy{background:var(--navy-soft);color:var(--navy)}

/* --- panel admina (karty jak w CRM) --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);border-top:4px solid var(--navy)}
.kpi span{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.kpi b{display:block;font-size:28px;color:var(--navy);line-height:1.15;margin-top:4px}
.kpi small{color:var(--muted);font-size:13px}
.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}.kpi.ok{border-top-color:var(--ok)}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.st-ferdig{background:var(--ok);color:#fff}.st-pagar{background:var(--yellow);color:var(--ink)}.st-ikke{background:#E6E8EC;color:var(--muted)}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;margin:1px 3px 1px 0;white-space:nowrap}
.flag.bad{background:var(--bad-soft);color:var(--bad)}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.info{background:var(--navy-soft);color:var(--navy)}
td.pos{color:var(--ok)}td.neg{color:var(--bad)}
.adm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.adm-tools .search{max-width:360px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.card h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:#FAFBFC}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#F7F9FC}
td.n,th.n{text-align:right}
td.n{font-weight:700}
tr.conflict td{background:var(--bad-soft)}
.drop{display:block;border:2px dashed #9AA3B2;border-radius:var(--r);padding:20px 14px;text-align:center;color:var(--muted);background:#fff;cursor:pointer}
.drop b{color:var(--navy);font-size:17px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.dlg p{margin:6px 0 12px;color:var(--muted)}
.stack{display:grid;gap:8px}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}

/* --- admin na PC: menu boczne jak w CRM --- */
.app.adminwide{max-width:none;box-shadow:none}
.adm-wrap{display:flex;min-height:100vh;min-height:100dvh}
.adm-side{display:none}
.adm-main{flex:1;min-width:0;display:flex;flex-direction:column}
@media (min-width:1000px){
  .adm-side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;width:250px;flex:0 0 250px;padding:18px 14px 16px;background:#fff;border-right:1px solid var(--line);overflow-y:auto}
  .adm-main .bar .brand{display:none}
  .adm-main .bar .back{display:none}
  .adm-main .content{max-width:1280px;width:100%;padding:20px 26px 30px}
  .adm-main .foot{padding-left:26px;padding-right:26px}
  .adm-main .atabs{display:none}
}
.sb-brand{padding:4px 8px 16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.sb-brand img{width:180px;height:auto;display:block;margin:-10px 0 -8px -14px}
.sb-brand .wm{font-weight:800;font-size:28px;color:var(--navy)}
.sb-sub{margin-top:8px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-group{margin:14px 10px 6px;color:#8A919C;font-size:10px;font-weight:800;letter-spacing:.14em}
.sb-item{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:9px 12px;border-radius:var(--r);color:#4B5563;font-size:14px;font-weight:650;text-align:left;width:100%}
.sb-item:hover:not(.on){background:var(--bg);color:var(--navy)}
.sb-item.on{background:var(--navy-soft);color:var(--navy);font-weight:750}
.sb-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;background:var(--yellow);border-radius:0 2px 2px 0}
.sb-item em{font-style:normal;font-size:12px;font-weight:800;min-width:24px;padding:1px 7px;border-radius:2px;background:#E6E8EC;color:var(--muted);text-align:center}
.sb-item.on em{background:var(--navy);color:#fff}
.sb-item em.bad{background:var(--bad-soft);color:var(--bad)}.sb-item em.warn{background:var(--warn-soft);color:var(--warn)}
.sb-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:12px}
.sb-user{padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
.sb-user b{display:block;font-size:13px;color:var(--ink)}.sb-user small{display:block;font-size:11px;color:var(--muted)}
.credit{padding:0 10px;color:var(--muted)}
.credit small{display:block;font-size:8px;font-weight:800;letter-spacing:.1em;color:#8A919C}
.credit b{display:block;margin-top:2px;font-size:11px;color:#4B5563}

.scanner{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:#000;z-index:30;display:none;flex-direction:column;color:#fff}
.scanner.open{display:flex}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.7),transparent);font-weight:700;font-size:17px}
.sc-top .back{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.sc-top .sp{flex:1}
.sc-frame{position:relative;z-index:1;flex:1;display:grid;place-items:center;pointer-events:none}
.sc-frame i{width:94%;max-width:540px;aspect-ratio:3/2;max-height:56vh;border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);border:4px solid var(--yellow);position:relative}
.sc-frame i::after{content:"";position:absolute;left:5%;right:5%;top:10%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:10%}50%{top:90%}}
.scanner.hit .sc-frame i{border-color:#34c759}
.sc-bottom{position:relative;z-index:2;background:#fff;color:var(--ink);border-radius:10px 10px 0 0;border-top:4px solid var(--yellow);padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sc-stat{font-weight:700;font-size:16px;color:var(--navy);min-height:24px}
.sc-stat.warn{color:var(--bad)}
.sc-sub{font-size:13px;color:var(--muted);margin:2px 0 10px}
.sc-demo{display:grid;gap:6px;margin-bottom:10px}
.sc-demo button{background:var(--bg);border-radius:var(--r);padding:10px 12px;text-align:left;font-size:14px}

.toast{position:fixed;left:50%;top:96px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);border-left:4px solid var(--yellow);font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app" id="app"><div class="screen" id="screen"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="scanner" id="scanner"></div>
<div class="toast" id="toast"></div>

<!--
  ================= DATA =================
  Alt som skal byttes ut mellom tellinger ligger her (eller importeres i Oppsett og bygges inn med "Last ned app-fil").
  - statuser: 2 eller 3 statuser (f.eks. Ny / Brukt / R). kode brukes i filene, navn vises, merke = bokstav fra etiketten.
  - sektorer: rekkefølgen på artiklene = rekkefølgen i listen på telefonen (hylle-rekkefølge).
  - artikler: hele artikkelregisteret (artikkelnr -> navn), brukes til søk og skann.
  - server.url: nettapp-adressen fra Google Apps Script (…/exec). Er den satt, sendes alt dit, og lister hentes fra arket.
-->
<script id="appdata" type="application/json">
{
 "versjon": "2026-11-04 v8 (lister fra Google Sheet)",
 "lager": "581 Oslo",
 "tittel": "Telling reservedeler",
 "testdata": false,
 "server": {
  "url": "https://script.google.com/macros/s/AKfycbwI05P7vgTgkWmnoWl2khB7GXzFqzhEslOCLcj4BXKC9v_kF64Jy6thhwCcpQwX-Et_UQ/exec"
 },
 "statuser": [
  {
   "kode": "ny",
   "navn": "Ny",
   "merke": "N"
  },
  {
   "kode": "brukt",
   "navn": "Brukt",
   "merke": "U"
  }
 ],
 "sektorer": [],
 "artikler": {}
}
</script>

<script>
(function(){
"use strict";
/* ================= OPPSTART ================= */
const PRISTINE="<!doctype html>\n"+document.documentElement.outerHTML;
const EMBEDDED=JSON.parse(document.getElementById("appdata").textContent);
const KEY="telling_res_"+String(EMBEDDED.lager||"581").replace(/\W+/g,"_")+"_v1";
const CFGKEY=KEY+"_cfg";
const LOGO="https://shop.doka.com/shop/_ui/responsive/common/images/doka_logo.svg";
const LOGO_IMG=w=>`<img src="${LOGO}" alt="Doka" ${w?`style="width:${w}px;height:auto"`:""} onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wm',textContent:'Doka'}))">`;
const XLSX_URL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const STORAGE_OK=lsSet(KEY+"_t","1")&&(lsDel(KEY+"_t"),true);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let CFG=EMBEDDED, LOCALCFG=false;
try{const c=JSON.parse(lsGet(CFGKEY));if(c&&Array.isArray(c.sektorer)){CFG=c;LOCALCFG=true}}catch(e){}

function blankState(keep){return {v:1,name:keep?keep.name:"",device:keep?keep.device:"",pin:keep?keep.pin:"",st:null,seq:keep?keep.seq:0,counts:{},extraNames:{},done:{},serials:{},dirty:{}}}
let S=null;try{S=JSON.parse(lsGet(KEY))}catch(e){}
if(!S||S.v!==1) S=blankState();
if(!S.device){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";S.device="T-"+Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join("")}
S.dirty=S.dirty||{};
{const m=location.hash.match(/pin=([^&]+)/);if(m){S.pin=decodeURIComponent(m[1]);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}}
const STATS=()=>(CFG.statuser&&CFG.statuser.length)?CFG.statuser:[{kode:"ny",navn:"Ny",merke:"N"},{kode:"brukt",navn:"Brukt",merke:"U"}];
function fixSt(){if(!S.st||!STATS().some(x=>x.kode===S.st)) S.st=STATS()[0].kode}
fixSt();
function save(){if(!lsSet(KEY,JSON.stringify(S))) toast("ADVARSEL: telling ble ikke lagret!")}

let view={screen:"start",sector:null,filter:"alle",q:""};
let installEvt=null;
let sheet={type:null};
let merged=null, mergeTelling=null;

/* ================= HJELPERE ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("nb-NO");
const sidx=k=>Math.max(0,STATS().findIndex(s=>s.kode===k));
const stName=k=>(STATS().find(s=>s.kode===k)||{navn:k}).navn;
const sec=code=>CFG.sektorer.find(s=>s.kode===code);
const nameOf=nr=>(CFG.artikler&&CFG.artikler[nr])||S.extraNames[nr]||(String(nr).includes("/")?variantName(nr):"(ukjent artikkel)");
/* Hovednummer med serienr-type (f.eks. 580100000 + QR 507927130): telles som egen linje "hovednr/serienr" med antall Ny/Brukt */
function variantName(nr){const [a,v]=String(nr).split("/");const n=(CFG.artikler||{})[v];return (n||("Serienr "+v))+" · "+a}
const isVariantSer=v=>/^\d{5,12}$/.test(String(v||"").trim());
const inRegister=nr=>!!(CFG.artikler&&CFG.artikler[nr]);
function normNr(x){x=String(x==null?"":x).trim().replace(/\.0+$/,"");if(/^\d{5}$/.test(x)) x="0"+x;return x}
function expected(code){const s=sec(code);return s?s.artikler:[]}
/* forventet (fra liste) + alt som er registrert i sektoren */
function itemsOf(code){
  const exp=expected(code);const seen=new Set(exp);
  return exp.map(nr=>({nr,na:nameOf(nr),extra:false})).concat(Object.keys(S.counts[code]||{}).filter(nr=>!seen.has(nr)).map(nr=>({nr,na:nameOf(nr),extra:true})));
}
const cnt=(code,nr)=>(S.counts[code]||{})[nr];
const sers=(code,nr)=>((S.serials[code]||{})[nr]||[]);
const totalOf=c=>STATS().reduce((a,s)=>a+(c.q[s.kode]||0),0);
function stats(code){const exp=expected(code);return {reg:Object.keys(S.counts[code]||{}).length,exp:exp.length,expDone:exp.filter(nr=>cnt(code,nr)).length}}
function knownPool(code){return [...new Set([...itemsOf(code).map(i=>i.nr),...Object.keys(CFG.artikler||{}),...Object.keys(S.extraNames)])]}
function findKnown(code,raw){const nr=normNr(raw);if(!nr) return null;const z=x=>x.replace(/^0+/,"");const pool=knownPool(code);
  return pool.find(x=>x===nr)||pool.find(x=>z(x)===z(nr))||null}
function candidates(code,t){if(!t) return [];const exp=new Set(expected(code));
  return knownPool(code).filter(nr=>nr.includes(t)).sort((a,b)=>(b.startsWith(t)-a.startsWith(t))||(exp.has(b)-exp.has(a))||(a.length-b.length)||a.localeCompare(b)).slice(0,5)}
function findInRegister(raw){
  const nr=normNr(raw);if(inRegister(nr)) return nr;
  const k=Object.keys(CFG.artikler||{}).find(x=>x.replace(/^0+/,"")===nr.replace(/^0+/,""));return k||null;
}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1800)}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

function evalExpr(e){
  if(!e) return null;let sum=0;
  for(const t of e.split("+")){ if(t==="") return null; let p=1;
    for(const x of t.split("×")){ if(x==="") return null; p*=parseInt(x,10);} sum+=p;}
  return sum;
}

/* ================= SKJERMER ================= */
function render(){
  const el=$("#screen");
  $("#app").classList.toggle("wide",view.screen==="merge"||view.screen==="oppsett"||view.screen==="admin");
  $("#app").classList.toggle("adminwide",view.screen==="admin"&&!!S.adminPin&&!!admin.data);
  if(view.screen==="start") el.innerHTML=startHTML();
  else if(view.screen==="sector") el.innerHTML=sectorHTML();
  else if(view.screen==="export") el.innerHTML=exportHTML();
  else if(view.screen==="merge") el.innerHTML=mergeHTML();
  else if(view.screen==="oppsett") el.innerHTML=oppsettHTML();
  else if(view.screen==="admin") el.innerHTML=adminHTML();
  bindScreen();
  const b=$(".bar");if(b) document.documentElement.style.setProperty("--barh",b.offsetHeight+"px");
}
function go(screen,extra){closeSheet();closeScanner();clearInterval(admin.timer);admin.timer=null;view=Object.assign({screen,sector:null,filter:"alle",q:""},extra||{});render();window.scrollTo(0,0)}

function bar(title,{back=false,meta="",progress=null}={}){
  return `<div class="bar"><div class="row">
    ${back?`<button class="back" data-act="home" aria-label="Tilbake">‹</button>`:""}
    <div class="brand">${LOGO_IMG()}<span class="lg">Lager<b>${esc(CFG.lager||"")}</b></span></div>
    <div class="meta">${meta}</div></div>
    <h2>${title}</h2>
    ${progress!==null?`<div class="progress"><i style="width:${progress}%"></i></div>`:""}</div>`;
}
function banners(){
  let h="";
  if(!STORAGE_OK) h+=`<div class="banner bad">Denne nettleseren lagrer ikke data (privat modus?). Ikke tell her – åpne appen i vanlig Chrome.</div>`;
  if(CFG.testdata) h+=`<div class="banner test"><b>TESTDATA.</b> Sektorlistene er eksempler – ikke bruk til ekte telling.</div>`;
  if(LOCALCFG&&CFG.kilde!=="server") h+=`<div class="banner info">Lokal konfigurasjon (importert i Oppsett på denne enheten).</div>`;
  if(serverUrl()&&syncState.status==="pin") h+=`<div class="banner bad">Feil kode – sjekk koden og skriv den inn på nytt.</div>`;
  return h;
}

function startHTML(){
  const tiles=CFG.sektorer.map(s=>{const st=stats(s.kode);const pct=st.exp?Math.round(st.expDone/st.exp*100):0;const d=S.done[s.kode];
    return `<button class="tile ${d?"done":""}" data-sector="${esc(s.kode)}">
      <span class="nm">Sektor</span><span class="code">${esc(s.kode)}</span>
      <span class="cnt">${d?`<span class="pill ok">Ferdig</span> `:""}${st.reg} registrert</span>
      ${st.exp?`<span class="mini" title="fra liste"><i style="width:${pct}%"></i></span>`:""}</button>`}).join("");
  return bar("Velg sektor",{meta:esc(new Date().toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"short"}))})+
  `<div class="content">${banners()}
     <label class="lbl" for="nm">Ditt navn</label>
     <input id="nm" class="field" placeholder="Fornavn" value="${esc(S.name)}" autocomplete="off">
     ${serverUrl()&&(!S.pin||syncState.status==="pin")?`<label class="lbl" for="pin" style="margin-top:12px">Kode (fra Łukasz)</label>
       <div style="display:flex;gap:8px"><input id="pin" class="field" inputmode="numeric" placeholder="Kode" value="${esc(S.pin)}" autocomplete="off"><button class="btn navy" data-act="pin-ok">OK</button></div>`:""}
     ${serverUrl()&&S.pin&&syncState.status!=="pin"?`<div class="statusline"><span>Sendes til server · ${esc(S.device)}</span>${syncBadge()}</div>`:""}
     ${tiles?`<div class="tiles">${tiles}</div>`:`<div class="empty-state">${serverUrl()?"Ingen sektorer ennå. Skriv koden for å hente listene.":"Ingen sektorer satt opp. Se Oppsett."}</div>`}
     <p class="hint">Velg sektoren du teller. Alt lagres i telefonen etter hver registrering${serverUrl()?" og sendes til server så snart det er nett":" og fungerer uten nett"}.</p>
     <div class="chips" style="justify-content:center;margin-top:14px">
       ${installEvt?`<button class="link" data-act="install" style="font-weight:800">Installer som app</button>`:""}<button class="link" data-act="merge">PC: slå sammen filer</button><button class="link" data-act="oppsett">Oppsett</button>${serverUrl()?`<button class="link" data-act="admin">Admin</button>`:""}</div>
     <div class="ver">Dataversjon: ${esc(CFG.versjon||"–")}</div>
   </div>
   <div class="foot"><button class="btn ${serverUrl()?"ghost":"navy"} grow" data-act="export">${serverUrl()?"Reservekopi / eksporter fil":"Send / eksporter telling"}</button></div>`;
}
function sectorHTML(){
  const code=view.sector;const st=stats(code);const hasExp=st.exp>0;
  if(view.filter!=="mangler") view.filter="reg";
  return bar(`${esc(code)} <span style="font-size:15px;font-weight:600;opacity:.8">· ${st.reg} reg.</span>`,{back:true,meta:`${esc(S.name||"Uten navn")}<br>${syncBadge()}`,progress:hasExp?Math.round(st.expDone/st.exp*100):null})+
  `<div class="content">
    <div class="entry">
      <button class="btn navy big" data-act="enter"><span style="font-size:26px;line-height:1">123</span>Skriv artikkelnr</button>
      <button class="btn primary big" data-act="scan"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8V4h4M21 4h4v4M25 20v4h-4M7 24H3v-4"/><path d="M8 9v10M11 9v10M14.5 9v10M18 9v10M20.5 9v10" stroke-width="1.8"/></svg> Skann etikett</button>
    </div>
    ${hasExp?`<div class="tabs"><button class="${view.filter==="reg"?"on":""}" data-filter="reg">Registrert (${st.reg})</button><button class="${view.filter==="mangler"?"on":""}" data-filter="mangler">Fra liste – mangler (${st.exp-st.expDone})</button></div>`
      :`<div class="sub">Registrert i sektoren (${st.reg})</div>`}
    ${st.reg||hasExp?`<div class="search small" style="margin-bottom:10px"><span>⌕</span><input id="q" class="field" inputmode="search" placeholder="Søk i listen" value="${esc(view.q)}" autocomplete="off"></div>`:""}
    <div class="list" id="list">${listHTML()}</div>
  </div>
  <div class="foot"><button class="btn primary block" data-act="finish">Sektor ferdig</button></div>`;
}
function filtered(){
  const code=view.sector;const q=view.q.trim().toLowerCase();const exp=expected(code);let it;
  if(view.filter==="mangler") it=exp.filter(nr=>!cnt(code,nr)).map(nr=>({nr,na:nameOf(nr),extra:false}));
  else it=Object.entries(S.counts[code]||{}).sort((a,b)=>(b[1].n||0)-(a[1].n||0)).map(([nr])=>({nr,na:nameOf(nr),extra:exp.length>0&&!exp.includes(nr)}));
  return q?it.filter(i=>i.nr.includes(q)||i.na.toLowerCase().includes(q)):it;
}
function qtyHTML(code,nr){
  const c=cnt(code,nr);if(!c) return `<span class="q">–</span>`;
  const ST=STATS();const parts=ST.map((s,i)=>c.q[s.kode]?`<span>${esc(s.navn)}<b class="c${i}">${fmt(c.q[s.kode])}</b></span>`:"").join("");
  return `<span class="qq">${parts||`<span>Tom<b class="c0">0</b></span>`}${sers(code,nr).length?`<span style="font-weight:600">serienr</span>`:""}</span>`;
}
function listHTML(){
  const code=view.sector;const it=filtered();
  if(!it.length){
    if(view.q.trim()) return `<div class="empty-state">Ingen treff.</div>`;
    return view.filter==="mangler"?`<div class="empty-state">Alt fra listen er registrert.</div>`
      :`<div class="empty-state">Ingen artikler registrert ennå.<br>Skriv eller skann artikkelnummeret.</div>`;
  }
  return it.map(i=>{const c=cnt(code,i.nr);
    return `<button class="item ${c?"counted":""} ${i.extra?"extra":""}" data-nr="${esc(i.nr)}">
      <span class="t"><span class="nr mono">${esc(i.nr)}${i.extra?' · <span class="pill warn">ikke på liste</span>':""}</span><span class="na">${esc(i.na)}</span></span>
      ${qtyHTML(code,i.nr)}</button>`}).join("");
}
function exportHTML(){
  const per={};exportItems().forEach(([code,i])=>{if(cnt(code,i.nr)) per[code]=(per[code]||0)+1});
  const rows=Object.entries(per).map(([code,n])=>{const st=sec(code)?stats(code):null;
    return `<div class="kv"><span>${esc(code)} ${S.done[code]?'<span class="pill ok">Ferdig</span>':'<span class="pill warn">Pågår</span>'}</span><b>${n} artikler</b></div>`}).join("");
  const canShare=!!(navigator.canShare&&window.File&&(()=>{try{return navigator.canShare({files:[new File(["x"],"x.csv",{type:"text/csv"})]})}catch(e){return false}})());
  return bar("Send telling",{back:true,meta:esc(S.name||"")})+
  `<div class="content">
    <div class="card"><h3>Innhold</h3>${rows||'<p class="hint">Ingenting talt ennå.</p>'}</div>
    <div class="card"><h3>Filnavn</h3><div class="mono" style="font-size:14px;word-break:break-all">${esc(fileName())}</div>
      <p class="hint">Send filen til Łukasz på Teams eller e-post. Tellingen blir liggende i telefonen til den slettes.</p></div>
    <div class="stack">
      ${canShare?`<button class="btn primary block" data-act="share" ${rows?"":"disabled"}>Del fil (Teams / e-post)</button>`:""}
      <button class="btn ${canShare?"ghost":"primary"} block" data-act="download" ${rows?"":"disabled"}>Last ned fil (CSV)</button>
      <button class="link" data-act="wipe" style="margin-top:14px;color:var(--bad)">Slett alle tellinger på denne telefonen…</button>
    </div>
  </div>`;
}

/* ================= CSV FRA TELEFON ================= */
function fileName(){const d=nowStr().slice(0,10);return `Telling_${String(CFG.lager||"").split(" ")[0]}_reservedeler_${(S.name||"ukjent").trim().replace(/\s+/g,"_")}_${d}.csv`}
const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
function buildCSV(){
  const ST=STATS();
  const H=["sektor","artikkelnr","navn",...ST.map(s=>s.kode),"totalt",...ST.map(s=>"utregning_"+s.kode),"talt_av","tidspunkt","ikke_paa_listen",...ST.map(s=>"serienr_"+s.kode)];
  const L=[H.join(";")];
  exportItems().forEach(([code,i])=>{const c=cnt(code,i.nr);if(!c) return;const sl=sers(code,i.nr);
    L.push([q(code),q(i.nr),q(i.na),...ST.map(x=>c.q[x.kode]||0),totalOf(c),...ST.map(x=>q(c.e[x.kode]||"")),q(c.by||""),q(c.ts||""),i.extra?"ja":"",
      ...ST.map(x=>q(sl.filter(y=>y.st===x.kode).map(y=>y.sn).join(", ")))].join(";"))});
  return "﻿"+L.join("\r\n");
}
/* Alle registreringer, også for sektorer/artikler som ikke lenger står i konfigurasjonen – ingenting skal forsvinne fra eksporten */
function exportItems(){
  const codes=CFG.sektorer.map(s=>s.kode);Object.keys(S.counts).forEach(k=>{if(!codes.includes(k)) codes.push(k)});
  const out=[];codes.forEach(code=>{const seen=new Set();const s=sec(code);
    itemsOf(code).forEach(i=>{seen.add(i.nr);out.push([code,i])});
    Object.keys(S.counts[code]||{}).forEach(nr=>{if(!seen.has(nr)) out.push([code,{nr,na:nameOf(nr),extra:!(s&&s.artikler.includes(nr))}])});});
  return out;
}
function downloadText(name,text,type){

function parseDelimited(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";
  const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":(first.includes("\t")?"\t":",");
  const rows=[];let row=[],cur="",inQ=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(inQ){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++} else inQ=false } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===d){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&txt[i+1]==="\n") i++; row.push(cur);cur=""; if(row.some(x=>x!=="")) rows.push(row); row=[] }
    else cur+=ch;}
  row.push(cur);if(row.some(x=>x!=="")) rows.push(row);
  return rows;
}
function parseCountFile(txt,fname){
  const rows=parseDelimited(txt);if(!rows.length) return [];
  const H=rows[0].map(h=>h.trim().toLowerCase());const ix=n=>H.indexOf(n);
  if(ix("artikkelnr")<0||ix("sektor")<0) throw new Error(fname+": ikke en tellefil fra appen");
  const ST=STATS();
  return rows.slice(1).map(c=>{const o={fil:fname,telling:c[ix("telling")]||"1",sektor:c[ix("sektor")],nr:normNr(c[ix("artikkelnr")]),na:c[ix("navn")],talt_av:c[ix("talt_av")]||"",tid:c[ix("tidspunkt")]||"",q:{}};
    ST.forEach(s=>{o.q[s.kode]=ix(s.kode)>=0?(parseInt(c[ix(s.kode)],10)||0):0});return o});
}
function mergeData(){
  const ST=STATS();const rows=merged.rows;
  const bySector={};rows.forEach(r=>{const b=bySector[r.sektor]=bySector[r.sektor]||{n:0,who:new Set(),files:new Set()};b.n++;b.who.add(r.talt_av);b.files.add(r.fil)});
  const sum={};rows.forEach(r=>{const a=sum[r.nr]=sum[r.nr]||{nr:r.nr,na:r.na,q:{},per:{},conf:false};
    ST.forEach(s=>a.q[s.kode]=(a.q[s.kode]||0)+r.q[s.kode]);
    if(a.per[r.sektor]){a.conf=true;a.per[r.sektor].dup.push(r)} else a.per[r.sektor]={q:Object.assign({},r.q),dup:[r]};
    if(a.per[r.sektor].dup.length>1) ST.forEach(s=>a.per[r.sektor].q[s.kode]+=r.q[s.kode]);});
  const arr=Object.values(sum).sort((a,b)=>b.conf-a.conf||a.nr.localeCompare(b.nr));
  const missing=[];CFG.sektorer.forEach(s=>s.artikler.forEach(nr=>{if(!rows.some(r=>r.sektor===s.kode&&r.nr===nr)) missing.push({sektor:s.kode,nr,na:nameOf(nr)})}));
  return {ST,rows,bySector,arr,missing};
}

async function readTableFile(file){

  }
  return parseDelimited(await file.text());
}
function colIdx(H,keys){const h=H.map(x=>String(x).trim().toLowerCase());return h.findIndex(x=>keys.some(k=>x===k||x.startsWith(k)))}
const K_NR=["artikkelnr","artikkel nr","artikkelnummer","artnr","art.nr","art nr","article","item","materialnr","varenr","artikel"];
const K_NA=["navn","beskrivelse","benevnelse","name","description","tekst","bezeichnung"];
const K_SEC=["sektor","sector","lokasjon","plass","location"];
const K_ORD=["rekkefølge","rekkefolge","sortering","order","sort","nr i rekke"];

async function importRegister(file){
  const rows=await readTableFile(file);if(rows.length<2) throw new Error("Tom fil");
  const iN=colIdx(rows[0],K_NR),iA=colIdx(rows[0],K_NA);
  if(iN<0||iA<0) throw new Error("Fant ikke kolonnene artikkelnr og navn i første rad");
  const reg={};let n=0;rows.slice(1).forEach(r=>{const nr=normNr(r[iN]);const na=String(r[iA]||"").trim();if(nr){reg[nr]=na||reg[nr]||"";n++}});
  const c=JSON.parse(JSON.stringify(CFG));c.artikler=reg;saveCfg(c);return `${n} artikler lest inn i registeret`;
}
async function importSectors(file){
  const rows=await readTableFile(file);if(rows.length<2) throw new Error("Tom fil");
  const H=rows[0];const iS=colIdx(H,K_SEC),iN=colIdx(H,K_NR),iA=colIdx(H,K_NA),iO=colIdx(H,K_ORD);
  if(iS<0||iN<0) throw new Error("Fant ikke kolonnene sektor og artikkelnr i første rad");
  const map=new Map();const c=JSON.parse(JSON.stringify(CFG));c.artikler=c.artikler||{};let n=0,dup=0;
  rows.slice(1).forEach((r,i)=>{const s=String(r[iS]||"").trim();const nr=normNr(r[iN]);if(!s||!nr) return;
    if(!map.has(s)) map.set(s,[]);const L=map.get(s);if(L.some(x=>x.nr===nr)){dup++;return}
    L.push({nr,o:iO>=0&&r[iO]!==""?parseFloat(String(r[iO]).replace(",",".")):i});
    if(iA>=0&&r[iA]&&!c.artikler[nr]) c.artikler[nr]=String(r[iA]).trim();n++});
  c.sektorer=[...map.entries()].map(([kode,L])=>({kode,artikler:L.sort((a,b)=>a.o-b.o).map(x=>x.nr)}));
  saveCfg(c);return `${c.sektorer.length} sektorer, ${n} linjer${dup?` (${dup} duplikater i samme sektor fjernet)`:""}`;
}

    <button class="key op sm" data-k="clr">C</button><button class="key" data-k="0">0</button><button class="key" data-k="00">00</button><button class="key ok" data-k="ok">${sheet.fromScan?"OK ⟲":"OK ›"}</button></div>`;

    mid=`<div class="stsel">Legges inn som: ${ST.map((s,i)=>`<button class="s${i} ${sheet.st===s.kode?"on":""}" data-st="${esc(s.kode)}">${esc(s.navn)}</button>`).join("")}</div>
      <div class="wfields">${f(0,"Antall i prøven","stk")}${f(1,"Vekt av prøven","g")}${f(2,"Total vekt (netto)","g")}</div>
      <div class="wres"><span>Beregnet antall</span><b>${r===null?"–":fmt(r)}</b></div>
      <p class="hint" style="margin-top:6px">Trekk fra vekt på boks/kasse. Andre statuser beholder det som er skrevet inn.</p>`;
  }else{
    const box=(s,i)=>{const e=sheet.vals[s.kode]||"";const v=evalExpr(e);
      return `<button class="nbx s${i} ${sheet.st===s.kode?"on":""}" data-st="${esc(s.kode)}"><span class="lab">${esc(s.navn.toUpperCase())} <i>${esc(s.merke||"")}</i></span>
        <span class="ex mono">${/[×+]/.test(e)?esc(e.replace(/\+/g," + ")):(sheet.wnote[s.kode]?"vekt":"&nbsp;")}</span><b>${e===""?"–":(v===null?"…":fmt(v))}</b></button>`};
    const tv=ST.reduce((a,s)=>a+(evalExpr(sheet.vals[s.kode])||0),0);
    mid=`<div class="nb" style="${cols}">${ST.map(box).join("")}</div>
      <div class="nbsum"><span>Trykk på feltet for å bytte</span><span>Totalt <b style="color:var(--ink)">${fmt(tv)}</b> stk</span></div>`;
  }
  return head(nr,nameOf(nr))+note+`<div class="tabs"><button class="${vk?"":"on"}" data-mode="antall">Antall</button><button class="${vk?"on":""}" data-mode="vekt">⚖ Vekt</button></div>
    ${mid}${keys}${sheet.fromScan?`<p class="hint" style="text-align:center">OK lagrer og åpner kameraet igjen</p>`:""}
    ${!sheet.edit&&!sheet.fromScan?`<div style="text-align:center"><button class="backnr" data-act="back-nr">‹ Annet artikkelnummer</button></div>`:""}`;
}
function weightResult(){const v=sheet.w.v.map(x=>parseFloat(x));if(!(v[0]>0&&v[1]>0&&v[2]>=0)||!sheet.w.v[2]) return null;return Math.round(v[2]/(v[1]/v[0]))}
function addSheet(){

/* ================= REGISTRERING ================= */
function setCount(nr,qv,ev){const c=view.sector;S.seq=(S.seq||0)+1;(S.counts[c]=S.counts[c]||{})[nr]={q:qv,e:ev,by:S.name||"",ts:nowStr(),n:S.seq};
  S.dirty[c+"|"+nr]=S.seq;if(S.done[c]){delete S.done[c];markSectorDirty(c)}save();scheduleSync()}
function markSectorDirty(c){S.seq=(S.seq||0)+1;S.dirty[c+"|#STATUS"]=S.seq}

function openEntry(typed){openSheet({type:"count",step:"nr",typed:typed||""})}
/* opts.edit = endre (erstatte) · ellers legges nye tall til det som er registrert */
function openCount(nr,opts){
  opts=opts||{};const ST=STATS();const c=cnt(view.sector,nr);const vals={};
  ST.forEach(s=>{const e=c&&c.e[s.kode];const n=c&&c.q[s.kode];vals[s.kode]=(c&&opts.edit)?(/^[0-9×+]+$/.test(e||"")?e:(n?String(n):"")):""});
  let st=S.st;if(c&&opts.edit){const nz=ST.filter(s=>c.q[s.kode]);if(nz.length===1) st=nz[0].kode}
  openSheet({type:"count",step:"qty",nr,edit:!!opts.edit,mode:"antall",vals,wnote:{},st,fromScan:!!opts.fromScan,w:{v:["20","",""],active:1}});
}
function pickNr(nr){if(!String(nr).includes("/")&&isSerialMain(nr)){openSheet({type:"count",step:"nr",typed:nr});toast("Velg serienr-type i listen – eller skann etiketten");return}openCount(nr,{})}
function setSt(st){sheet.st=st;S.st=st;save();renderSheet()}
function commit(){
  const ST=STATS();
  if(sheet.mode==="vekt"){const r=weightResult();if(r===null){toast("Fyll inn alle tre feltene");return}
    sheet.vals[sheet.st]=String(r);sheet.wnote[sheet.st]=`vekt ${sheet.w.v[2]}g ÷ (${sheet.w.v[1]}g/${sheet.w.v[0]}stk)`}
  if(!ST.some(s=>sheet.vals[s.kode])){toast("Skriv inn antall");return}
  const qv={},ev={};
  for(const s of ST){const e=sheet.vals[s.kode]||"";const v=e?evalExpr(e):0;if(v===null){toast("Regnestykket er ikke ferdig");return}qv[s.kode]=v;ev[s.kode]=sheet.wnote[s.kode]||e}
  const nr=sheet.nr;const old=cnt(view.sector,nr);
  if(old&&!sheet.edit){ST.forEach(s=>{const k=s.kode;const oe=old.e[k]||(old.q[k]?String(old.q[k]):"");
    qv[k]=(old.q[k]||0)+qv[k];ev[k]=[oe,ev[k]].filter(Boolean).join(" + ")})}
  setCount(nr,qv,ev);
  const msg=`${nameOf(nr)}: ${ST.filter(s=>qv[s.kode]).map(s=>s.navn+" "+fmt(qv[s.kode])).join(" · ")||"0"}`;
  refreshList();
  if(sheet.fromScan){closeSheet();toast(msg);openScanner();return}
  if(sheet.edit){closeSheet();toast(msg);return}
  openEntry();toast("✓ "+msg);
}
function key(k){
  if(sheet.step==="nr"){
    let t=sheet.typed||"";
    if(k==="scan"){closeSheet();openScanner();return}
    if(k==="name"){openSheet({type:"add",q:""});setTimeout(()=>{const x=$("#aq");if(x) x.focus()},230);return}
    if(k==="ok"){const ex=findKnown(view.sector,t);const c=candidates(view.sector,t).filter(x=>x!==ex);
      if(ex) pickNr(ex); else if(c.length===1) pickNr(c[0]); else if(t.length>=4&&!c.length) openSheet({type:"unknown",nr:normNr(t)}); else toast(t?"Velg artikkel i listen":"Skriv artikkelnummeret");return}
    if(k==="del") t=t.slice(0,-1); else if(k==="clr") t=""; else if(/^\d+$/.test(k)) t=(t+k).slice(0,12);
    sheet.typed=t;renderSheet();return;
  }
  if(sheet.mode==="vekt"){
    const w=sheet.w;let v=w.v[w.active]||"";
    if(k==="ok"){commit();return}
    if(k==="del") v=v.slice(0,-1); else if(k==="clr") v="";
    else if(k==="×"){ if(w.active<2) w.active++; renderSheet(); return}
    else if(k==="+"){ if(v.includes(".")) return; v=(v||"0")+"."; }
    else v=(v+k).replace(/^0+(?=\d)/,"").slice(0,8);
    w.v[w.active]=v;renderSheet();return;
  }
  if(k==="ok"){commit();return}
  let e=sheet.vals[sheet.st]||"";delete sheet.wnote[sheet.st];
  if(k==="del") e=e.slice(0,-1);
  else if(k==="clr") e="";
  else if(k==="×"||k==="+"){ if(!e||/[×+]$/.test(e)) return; e+=k; }
  else { e+=k; e=e.replace(/(^|[×+])0+(?=\d)/g,"$1"); if(e.length>18) return; }
  sheet.vals[sheet.st]=e;renderSheet();
}

function refreshList(){if(view.screen!=="sector") return;const y=window.scrollY;render();window.scrollTo(0,y)}
function updateListOnly(){const l=$("#list");if(l){l.innerHTML=listHTML();bindList()}}
function scrollToItem(nr){const b=document.querySelector(`.item[data-nr="${CSS.escape(nr)}"]`);if(b) b.scrollIntoView({block:"center",behavior:"smooth"})}

/* ================= SKANNER (Chrome Android: BarcodeDetector, krever https) ================= */
const scan={on:false,stream:null,det:null,timer:null,prev:"",paused:false,track:null,torch:false};
function scannerHTML(){
  const ST=STATS();
  return `<video id="scanvid" playsinline muted></video>
  <div class="sc-top"><button class="back" data-sc="close" aria-label="Lukk">✕</button><span class="sp">Skann etikett · ${esc(view.sector||"")}</span>
    <button class="back" id="torchbtn" data-sc="torch" aria-label="Lys" style="display:none">💡</button></div>
  <div class="sc-frame"><i></i></div>
  <div class="sc-bottom">
    <div class="sc-stat" id="scstat">Sikt mot strekkoden</div>
    <div class="sc-sub" id="scsub">Strekkode = artikkel. Etikett med QR = registrerer serienummer.</div>
    <div class="stsel">Serienr som: ${ST.map((s,i)=>`<button class="s${i} ${S.st===s.kode?"on":""}" data-scst="${esc(s.kode)}">${esc(s.navn)}</button>`).join("")}</div>
    <div class="sc-demo" id="scdemo" style="display:none"></div>
    <button class="btn ghost block" data-sc="type">Skriv nummer i stedet</button>
  </div>`;
}
function setStat(t,warn,sub){const a=$("#scstat");if(!a) return;a.textContent=t;a.classList.toggle("warn",!!warn);if(sub!==undefined) $("#scsub").textContent=sub}
function showDemo(){
  const exp=expected(view.sector);const a=exp.find(nr=>!cnt(view.sector,nr))||exp[0]||Object.keys(CFG.artikler||{})[0];
  const d=$("#scdemo");if(!d) return;d.style.display="grid";
  d.innerHTML=`<div class="hint" style="margin:0">Test uten kamera:</div>
    ${a?`<button data-demo="${esc(a)}">Simuler strekkode <b class="mono">${esc(a)}</b></button>`:""}
    <button data-demo="12345678">Simuler ukjent strekkode <b class="mono">12345678</b></button>
    <button data-demo="583034000|DFF-00${String(11+Math.floor(Math.random()*80))}">Simuler serienr-etikett <b class="mono">583034000 + QR</b></button>`;
  d.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.demo.split("|");onScan(x,y||null);if(y) showDemo()});
}
async function openScanner(){
  if(!view.sector){toast("Velg sektor først");return}
  const el=$("#scanner");el.innerHTML=scannerHTML();el.classList.add("open");el.classList.remove("hit");
  scan.on=true;scan.paused=false;scan.prev="";bindScanner();
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices||!window.isSecureContext||location.protocol==="content:"||location.protocol==="file:"){
    setStat("Kamera ikke tilgjengelig",true,(!window.isSecureContext||location.protocol!=="https:")?"Appen er åpnet som fil. Kameraet virker bare når appen åpnes fra en https-adresse – skriv nummeret i stedet.":"Denne nettleseren har ikke strekkodeleser – bruk Chrome på Android.");showDemo();return}
  try{
    const fm=await BarcodeDetector.getSupportedFormats();
    scan.det=new BarcodeDetector({formats:["code_39","code_128","qr_code","ean_13"].filter(f=>fm.includes(f))});
    scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!scan.on){stopStream();return}
    const v=$("#scanvid");v.srcObject=scan.stream;await v.play();
    scan.track=scan.stream.getVideoTracks()[0];
    try{if(scan.track.getCapabilities&&scan.track.getCapabilities().torch) $("#torchbtn").style.display="grid"}catch(e){}
    loop();
  }catch(e){
    if(location.protocol!=="https:") setStat("Kamera virker ikke når appen er åpnet som fil",true,"Åpnet fra "+location.protocol+"//. Kameraet krever at appen åpnes fra en https-adresse. Skriv nummeret i stedet.");
    else setStat("Får ikke tilgang til kameraet",true,"Tillat kamera for siden i Chrome (lås-ikonet i adresselinjen), eller skriv nummeret.");
    showDemo()}
}
function stopStream(){if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null}}
function closeScanner(){scan.on=false;clearTimeout(scan.timer);stopStream();const el=$("#scanner");if(el){el.classList.remove("open");el.innerHTML=""}}
function loop(){
  if(!scan.on||!scan.det) return;
  scan.det.detect($("#scanvid")).then(codes=>{if(!scan.paused) handleCodes(codes)}).catch(()=>{}).finally(()=>{if(scan.on) scan.timer=setTimeout(loop,120)});
}
function handleCodes(codes){
  let art=null,ser=null;
  codes.forEach(c=>{const t=String(c.rawValue||"").trim();if(c.format==="qr_code"){if(t) ser=t} else if(/^\d{5,10}$/.test(t)) art=t});
  if(!art&&!ser){scan.prev="";scan.n=0;scan.warn=null;return}
  const k=(art||"")+"|"+(ser||"");
  if(k!==scan.prev){scan.prev=k;scan.n=1;return}  // samme kode i to bilder på rad = sikker lesning
  scan.n=(scan.n||1)+1;
  /* bare strekkode: vent litt lenger, så en liten QR (serienr) rekker å bli lest */
  if(art&&!ser&&scan.n<5){if(scan.n===2&&scan.warn!==art) setStat(normNr(art)+" – leser …",false,"Har etiketten QR-kode? Hold hele etiketten i bildet.");return}
  scan.prev="";scan.n=0;onScan(art,ser);
}
function hasSerials(nr){return Object.values(S.serials||{}).some(m=>m&&m[nr]&&m[nr].length)}
function isSerialMain(nr){const p=nr+"/";return hasSerials(nr)||knownPool(view.sector).some(x=>x.startsWith(p))||Object.values(S.counts||{}).some(m=>Object.keys(m||{}).some(x=>x.startsWith(p)))}
function flash(){const el=$("#scanner");el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),350);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function onScan(rawArt,ser){
  if(ser&&!rawArt){setStat(`Serienr ${ser} – mangler strekkode`,true,"Hold hele etiketten i bildet (strekkode + QR).");return}
  flash();
  /* QR med bare tall = serienr-TYPE under hovednummeret (mange stk, Ny/Brukt) – telles med antall */
  if(ser&&isVariantSer(ser)){const key=normNr(rawArt)+"/"+String(ser).trim();closeScanner();openCount(key,{fromScan:true});return}
  const art=findKnown(view.sector,rawArt);
  if(!art){closeScanner();openSheet({type:"unknown",nr:normNr(rawArt),ser,fromScan:true});return}
  if(ser){registerSerial(art,ser);return}
  if(isSerialMain(art)){scan.warn=rawArt;setStat(nameOf(art)+" har serienummer",true,"Hold hele etiketten i bildet – strekkode + QR-kode.");return}
  closeScanner();openCount(art,{fromScan:true});
}
function registerSerial(art,ser){
  const code=view.sector;S.serials[code]=S.serials[code]||{};const arr=S.serials[code][art]=S.serials[code][art]||[];
  const dup=arr.find(x=>x.sn===ser);
  if(dup){setStat(`${ser} er allerede skannet (${stName(dup.st)})`,true,`${nameOf(art)} – ${arr.length} stk registrert`);try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){};return}
  arr.push({sn:ser,st:S.st});
  const qv={},ev={};STATS().forEach(s=>{qv[s.kode]=arr.filter(x=>x.st===s.kode).length;ev[s.kode]=qv[s.kode]?"serienr":""});
  setCount(art,qv,ev);refreshList();
  setStat(`✓ ${ser} registrert som ${stName(S.st)}`,false,`${nameOf(art)} – ${STATS().map(s=>s.navn+" "+qv[s.kode]).join(" · ")}. Skann neste.`);
  scan.paused=true;setTimeout(()=>{scan.paused=false},900);
}
function bindScanner(){
  const el=$("#scanner");
  el.querySelectorAll("[data-sc]").forEach(b=>b.onclick=async()=>{const a=b.dataset.sc;
    if(a==="close") closeScanner();
    else if(a==="type"){closeScanner();const qi=$("#q");if(qi) qi.focus()}
    else if(a==="torch"&&scan.track){scan.torch=!scan.torch;try{await scan.track.applyConstraints({advanced:[{torch:scan.torch}]})}catch(e){}}});
  el.querySelectorAll("[data-scst]").forEach(b=>b.onclick=()=>{S.st=b.dataset.scst;save();el.querySelectorAll("[data-scst]").forEach(x=>x.classList.toggle("on",x.dataset.scst===S.st))});
}

/* ================= SERVER (Google Apps Script) ================= */
let syncState={status:"idle"},syncTimer=null,syncing=false;
function serverUrl(){return String((CFG.server&&CFG.server.url)||(EMBEDDED.server&&EMBEDDED.server.url)||"").trim()}
function pendingN(){return Object.keys(S.dirty).length}
function syncBadge(){
  if(!serverUrl()) return "";
  const n=pendingN();const st=syncState.status;
  const [cls,txt]=st==="pin"?["pin","⚠ Feil kode"]:st==="offline"?["offline",`⚠ Uten nett · ${n} venter`]:st==="err"?["err",`⚠ Feil · ${n} venter`]
    :(n||st==="busy")?["busy",n?`⟳ Sender ${n}…`:"⟳ Sender…"]:["ok","✓ Alt sendt"];
  return `<span class="sync ${cls} js-sync" data-act="sync-now">${txt}</span>`;
}
function updateSyncBadge(){document.querySelectorAll(".js-sync").forEach(el=>{el.outerHTML=syncBadge()});document.querySelectorAll(".js-sync").forEach(b=>b.onclick=()=>act("sync-now"))}
function scheduleSync(ms){if(!serverUrl()) return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,ms==null?800:ms)}
function buildRecord(key){
  const i=key.lastIndexOf("|");const code=key.slice(0,i),nr=key.slice(i+1);const v=S.dirty[key];
  if(nr==="#STATUS") return {type:"sector",key,v,sektor:code,done:!!S.done[code],by:S.name};
  const c=cnt(code,nr);if(!c) return null;const sl=sers(code,nr);const sn={};
  STATS().forEach(s=>{sn[s.kode]=sl.filter(x=>x.st===s.kode).map(x=>x.sn)});
  return {key,v,sektor:code,nr,navn:nameOf(nr),q:c.q,e:c.e,sn,by:c.by,ts:c.ts,extra:expected(code).length>0&&!expected(code).includes(nr)};
}
async function sync(){
  const url=serverUrl();if(!url||!S.pin){updateSyncBadge();return}
  if(syncing) return;
  const keys=Object.keys(S.dirty);
  if(!keys.length){if(syncState.status!=="pin") syncState={status:"ok"};updateSyncBadge();return}
  syncing=true;syncState={status:"busy"};updateSyncBadge();
  const recs=[];keys.slice(0,150).forEach(k=>{const r=buildRecord(k);if(r) recs.push(r); else delete S.dirty[k]});
  let again=false;
  try{
    const r=await fetch(url,{method:"POST",body:JSON.stringify({pin:S.pin,device:S.device,navn:S.name,statuser:STATS().map(s=>({kode:s.kode,navn:s.navn})),records:recs})});
    const j=await r.json();
    if(!j.ok){syncState={status:j.error==="pin"?"pin":"err"};if(j.error==="pin"&&view.screen==="start"&&!sheet.type) render()}

  const misRows=[];c.sectors.forEach(x=>x.missing.forEach(nr=>misRows.push([x.code,nr,(admin.data.artikler||{})[nr]||""])));
  const lineHead=["Mottatt","Telefon","Talt av","Sektor","Artikkelnr","Navn",...ST.map(s=>s.navn),...ST.map(s=>"Utregning "+s.navn)];
  const lineRows=c.rows.map(r=>[fmtTime(r.mot),r.tel,r.by,r.sektor,r.nr,r.navn,...ST.map(s=>r.q[s.kode]),...ST.map(s=>r.e[s.kode])]);
  const base=`Telling_581_reservedeler_ADMIN_${nowStr().slice(0,16).replace(/[ :]/g,"-")}`;
  try{const X=await loadXLSX();const wb=X.utils.book_new();
    const add=(n,h,d,w)=>{const ws=X.utils.aoa_to_sheet([h,...d]);ws["!cols"]=h.map((_,i)=>({wch:w[i]||12}));ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:d.length,c:h.length-1}})};X.utils.book_append_sheet(wb,ws,n)};
    add("Sum per artikkel",sumHead,sumRows,[12,42]);add("Sektorer",secHead,secRows,[10,12,24]);add("Fra liste mangler",["Sektor","Artikkelnr","Navn"],misRows,[10,12,42]);add("Alle linjer",lineHead,lineRows,[13,10,12,10,12,42]);
    X.writeFile(wb,base+".xlsx");toast("Excel lastet ned")}
  catch(e){downloadText(base+".csv","﻿"+[sumHead,...sumRows].map(r=>r.map(v=>typeof v==="number"?v:q(v)).join(";")).join("\r\n"));toast("Lagret som CSV")}
}

/* ================= HENDELSER ================= */
function bindScreen(){
  document.querySelectorAll("#screen [data-sector]").forEach(b=>b.onclick=()=>{
    if(!S.name.trim()){toast("Skriv navnet ditt først");$("#nm").focus();return}
    if(serverUrl()&&!S.pin){toast("Skriv koden først");const pi=$("#pin");if(pi) pi.focus();return}
    go("sector",{sector:b.dataset.sector})});
  const nm=$("#nm");if(nm) nm.oninput=()=>{S.name=nm.value;save()};
  document.querySelectorAll("#screen [data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  document.querySelectorAll("#screen [data-filter]").forEach(b=>b.onclick=()=>{view.filter=b.dataset.filter;render()});
  document.querySelectorAll("#screen [data-mt]").forEach(b=>b.onclick=()=>{mergeTelling=b.dataset.mt;render()});
  document.querySelectorAll("#screen [data-atab]").forEach(b=>b.onclick=()=>{admin.tab=b.dataset.atab;const y=window.scrollY;render();window.scrollTo(0,y)});
  const aq2=$("#aq2");if(aq2) aq2.oninput=()=>{admin.q=aq2.value;const y=window.scrollY;const pos=aq2.selectionStart;render();window.scrollTo(0,y);const f=$("#aq2");f.focus();try{f.setSelectionRange(pos,pos)}catch(e){}};
  const ap=$("#apin");if(ap) ap.onkeydown=e=>{if(e.key==="Enter") act("admin-pin")};
  const qi=$("#q");if(qi){qi.oninput=()=>{view.q=qi.value;updateListOnly()};qi.onkeydown=e=>{if(e.key==="Enter") qi.blur()}}
  const fi=$("#files");if(fi) fi.onchange=async()=>{
    try{let rows=[];const files=[];for(const f of fi.files){rows=rows.concat(parseCountFile(await f.text(),f.name));files.push(f.name)}
      merged={rows,files};mergeTelling=null;render()}catch(e){toast(e.message||"Kunne ikke lese filen")}};
  const ir=$("#imp-reg");if(ir) ir.onchange=async()=>{try{toast(await importRegister(ir.files[0]));render()}catch(e){toast("Feil: "+(e.message||"kunne ikke lese filen"))}};
  const is=$("#imp-sec");if(is) is.onchange=async()=>{try{toast(await importSectors(is.files[0]));render()}catch(e){toast("Feil: "+(e.message||"kunne ikke lese filen"))}};
  document.querySelectorAll(".js-sync").forEach(b=>b.onclick=()=>act("sync-now"));
  bindList();
}
function bindList(){
  document.querySelectorAll("#list [data-nr]").forEach(b=>b.onclick=()=>{const nr=b.dataset.nr;
    if(view.filter==="mangler") openCount(nr,{}); else openCount(nr,{edit:true})});
}
function bindSheet(){
  const el=$("#sheet");
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{sheet.mode=b.dataset.mode;renderSheet()});
  el.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>setSt(b.dataset.st));
  el.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{sheet.w.active=+b.dataset.wf;renderSheet()});
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  el.querySelectorAll("[data-addnr]").forEach(b=>b.onclick=()=>pickNr(b.dataset.addnr));
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pickNr(b.dataset.pick));
  const aq=$("#aq");if(aq) aq.oninput=()=>{sheet.q=aq.value;const pos=aq.selectionStart;renderSheet();const n=$("#aq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
}
function act(a){
  switch(a){
    case "home": go("start"); break;
    case "install": if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})} break;
    case "export": go("export"); break;
    case "merge": go("merge"); break;
    case "oppsett": go("oppsett"); break;
    case "admin": go("admin"); if(S.adminPin) adminLoad(); break;
    case "admin-pin": {const v=($("#apin").value||"").trim();if(!v){toast("Skriv admin-koden");return}S.adminPin=v;save();admin.err="";adminLoad();break}
    case "admin-refresh": adminLoad(); break;
    case "admin-xlsx": adminExcel(); break;
    case "admin-logout": S.adminPin="";admin.data=null;save();render(); break;
    case "download": downloadText(fileName(),buildCSV()); break;
    case "share": shareCSV(); break;
    case "scan": closeSheet(); openScanner(); break;
    case "enter": openEntry(); break;
    case "back-nr": openEntry(); break;
    case "to-edit": openCount(sheet.nr,{edit:true,fromScan:sheet.fromScan}); break;
    case "unk-add": {const nr=sheet.nr,ser=sheet.ser,fs=sheet.fromScan;const na=($("#una").value||"").trim();if(!na){toast("Skriv en kort beskrivelse");$("#una").focus();return}
      S.extraNames[nr]=na+" (ikke i register)";save();
      if(ser){closeSheet();registerSerial(nr,ser);openScanner()} else openCount(nr,{fromScan:fs});break}
    case "unk-retype": openEntry(sheet.nr); break;
    case "finish": openSheet({type:"finish"}); break;
    case "finish-ok": S.done[view.sector]=true;markSectorDirty(view.sector);save();scheduleSync(100);toast(`${view.sector} ferdig`);go("start");break;
    case "pin-ok": {const v=($("#pin").value||"").trim();if(!v){toast("Skriv koden");return}S.pin=v;syncState={status:"busy"};save();render();fetchRemoteCfg(true);scheduleSync(100);break}
    case "srv-save": saveServer(); break;
    case "srv-pull": fetchRemoteCfg(true).then(ok=>toast(ok?"Lister hentet fra Google Sheet":"Fant ingen lister i arket (eller ingen forbindelse)")); break;
    case "sync-now": scheduleSync(0); break;
    case "show-missing": closeSheet(); view.filter="mangler"; view.q=""; render(); break;
    case "close": closeSheet(); break;
    case "reset-merge": merged=null; render(); break;
    case "xlsx-merged": exportMerged(); break;
    case "bake": bakeApp(); break;
    case "reset-cfg": openSheet({type:"confirm",title:"Bruke innebygd konfigurasjon?",text:"Importerte lister på denne enheten fjernes. Tellinger beholdes.",ok:"Ja, tilbakestill",
      run:()=>{lsDel(CFGKEY);CFG=EMBEDDED;LOCALCFG=false;fixSt();closeSheet();render()}}); break;
    case "wipe": openSheet({type:"confirm",danger:true,title:"Slette alle tellinger?",text:(Object.keys(S.dirty).length?`<b style="color:var(--bad)">${Object.keys(S.dirty).length} registreringer er ikke sendt til serveren ennå!</b><br>`:"")+(serverUrl()?"Det som er sendt ligger trygt i Google Sheet. ":"<b>Send filen først.</b> ")+"Alle registreringer på denne telefonen slettes.",ok:"Slett alt",
      run:()=>{S=blankState(S);fixSt();save();closeSheet();toast("Tellinger slettet");go("start")}}); break;
    case "confirm-ok": if(sheet.run) sheet.run(); break;
  }
}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{
  if(sheet.type!=="count"||e.target.tagName==="INPUT") return;
  if(sheet.step==="nr"){ if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key==="Backspace") key("del"); else if(e.key==="Enter") key("ok"); else if(e.key==="Escape") closeSheet(); else return; e.preventDefault(); return; }
  if(/^[0-9]$/.test(e.key)) key(e.key);
  else if(e.key==="*"||e.key==="x"||e.key==="X") key("×");
  else if(e.key==="+") key("+");
  else if(e.key===","||e.key===".") {if(sheet.mode==="vekt") key("+"); else return}
  else if(e.key==="Backspace") key("del");
  else if(e.key==="Enter") key("ok");
  else if(e.key==="Escape") closeSheet();
  else if(e.key==="Tab"&&sheet.mode!=="vekt"){const ST=STATS();setSt(ST[(sidx(sheet.st)+1)%ST.length].kode)}
  else return;
  e.preventDefault();
});
window.addEventListener("beforeunload",e=>{save();if(Object.keys(S.dirty||{}).length){e.preventDefault();e.returnValue=""}});
render();
/* ================= TILBAKE-KNAPPEN: blir i appen ================= */
/* Tilbake lukker skanner/vindu eller går til startsiden – den lukker ikke appen. */
/* ================= SOM APP: installering, fullskjerm, uten nett ================= */
const IS_APP=()=>{try{return matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: standalone)").matches}catch(e){return false}};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(view.screen==="start"&&!sheet.type) render()});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("Appen er installert – åpne den fra startskjermen")});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
/* fullskjerm i vanlig Chrome på telefon: ved første trykk (nettleseren tillater det bare etter et trykk) */
document.addEventListener("pointerdown",()=>{
  if(IS_APP()||document.fullscreenElement||!document.documentElement.requestFullscreen) return;
  if(!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) return;
  if($("#scanner").classList.contains("open")) return;
  document.documentElement.requestFullscreen({navigationUI:"hide"}).catch(()=>{});
},{capture:true,passive:true});
let guardArmed=false;
function backGuard(){try{history.pushState({telling:1},"",location.pathname+location.search);guardArmed=true}catch(e){}}
try{history.replaceState({telling:0},"",location.pathname+location.search)}catch(e){}
backGuard();
/* Chrome hopper over historikk lagt til uten trykk – sett vakten på nytt ved første trykk */
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(!guardArmed) backGuard()},{capture:true,passive:true}));
window.addEventListener("popstate",()=>{
  guardArmed=false;
  if($("#scanner").classList.contains("open")) closeScanner();
  else if(sheet.type) closeSheet();
  else if(view.screen!=="start") go("start");
  else toast("Appen lukkes ikke med Tilbake. Alt er lagret i telefonen.");
  backGuard();
});
if(serverUrl()&&S.pin){fetchRemoteCfg(false);scheduleSync(500)}
})();
</script>
